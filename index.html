<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101110">
  <meta name="description" content="HD2Lab Todo Master: a personal space for everyday life, useful services, and AI experiments.">
  <title>HD2Lab | Todo Master</title>

  <!-- Favicons -->
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32x32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="HD2Lab">
  <meta property="og:title" content="HD2Lab | Todo Master">
  <meta property="og:description" content="A personal space for everyday life, useful services, and AI experiments.">
  <meta property="og:url" content="https://hyangdan2.github.io/AGPilot0002/">
  <meta property="og:image" content="https://hyangdan2.github.io/AGPilot0002/social-preview.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:alt" content="HD2Lab Todo Master — Hello, World. Life is a lab.">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="HD2Lab | Todo Master">
  <meta name="twitter:description" content="A personal space for everyday life, useful services, and AI experiments.">
  <meta name="twitter:image" content="https://hyangdan2.github.io/AGPilot0002/social-preview.png">

  <!-- Styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <div class="app-container">
      
      <!-- Eyebrow -->
      <div class="eyebrow">
        <i></i>
        <span>02 / SERVE · DAILY PRODUCTIVITY &amp; TASK LAB</span>
      </div>

      <!-- Header with non-linked HD2Lab Brand Logo & Text -->
      <header class="app-header">
        <div class="brand">
          <span class="mark" aria-hidden="true"></span>
          HD2Lab
          <em>Todo Master</em>
        </div>

        <div class="header-actions">
          <button id="themeToggleBtn" class="about" title="테마 전환" aria-label="테마 전환">
            <span class="theme-label">LIGHT</span>
          </button>
          <button id="exportBtn" class="about" title="데이터 백업(JSON)" aria-label="데이터 내보내기">
            BACKUP 📥
          </button>
          <label for="importInput" class="about file-label" title="데이터 복원(JSON)" aria-label="데이터 가져오기">
            RESTORE 📤
            <input type="file" id="importInput" accept=".json" hidden>
          </label>
        </div>
      </header>

      <!-- Stats & Progress Hub -->
      <section class="stats-card">
        <div class="progress-info">
          <div class="progress-labels">
            <span class="hub-code">PROGRESS</span>
            <span id="progressPercent" class="percent">0%</span>
          </div>
          <div class="progress-bar-bg">
            <div id="progressBar" class="progress-bar-fill" style="width: 0%;"></div>
          </div>
        </div>
        <div class="stats-counter">
          <div class="stat-item">
            <span class="stat-num" id="statTotal">0</span>
            <span class="stat-desc">TOTAL</span>
          </div>
          <div class="stat-divider"></div>
          <div class="stat-item">
            <span class="stat-num text-active" id="statActive">0</span>
            <span class="stat-desc">ACTIVE</span>
          </div>
          <div class="stat-divider"></div>
          <div class="stat-item">
            <span class="stat-num text-done" id="statDone">0</span>
            <span class="stat-desc">DONE</span>
          </div>
        </div>
      </section>

      <!-- Todo Input Form -->
      <form id="todoForm" class="todo-form">
        <div class="input-main">
          <input 
            type="text" 
            id="todoInput" 
            placeholder="새로운 할 일을 입력하세요... (Enter)" 
            autocomplete="off"
            required
          >
          <button type="submit" class="hero-action-btn">추가</button>
        </div>
        <div class="input-sub">
          <div class="option-group">
            <label for="categorySelect">카테고리</label>
            <select id="categorySelect">
              <option value="개인">👤 개인</option>
              <option value="업무">💼 업무</option>
              <option value="공부">📚 공부</option>
              <option value="쇼핑">🛒 쇼핑</option>
              <option value="기타">📌 기타</option>
            </select>
          </div>
          <div class="option-group">
            <label for="prioritySelect">우선순위</label>
            <select id="prioritySelect">
              <option value="medium">⚡ 보통</option>
              <option value="high">🔥 높음</option>
              <option value="low">🌱 낮음</option>
            </select>
          </div>
          <div class="option-group">
            <label for="dueDateInput">마감일</label>
            <input type="date" id="dueDateInput">
          </div>
        </div>
      </form>

      <!-- Control Bar (Filters, Search, Sort) -->
      <div class="control-bar">
        <div class="filter-tabs">
          <button class="tab-btn active" data-filter="all">전체</button>
          <button class="tab-btn" data-filter="active">진행 중</button>
          <button class="tab-btn" data-filter="completed">완료됨</button>
        </div>
        
        <div class="filter-options">
          <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="할 일 검색...">
          </div>
          <select id="categoryFilter">
            <option value="all">전체 카테고리</option>
            <option value="개인">👤 개인</option>
            <option value="업무">💼 업무</option>
            <option value="공부">📚 공부</option>
            <option value="쇼핑">🛒 쇼핑</option>
            <option value="기타">📌 기타</option>
          </select>
          <select id="sortSelect">
            <option value="created-desc">최신순</option>
            <option value="created-asc">오래된순</option>
            <option value="due-date">마감일 임박순</option>
            <option value="priority">우선순위순</option>
          </select>
        </div>
      </div>

      <!-- Todo List Container -->
      <main class="todo-main">
        <ul id="todoList" class="todo-list">
          <!-- 동적으로 투두 아이템 렌더링 -->
        </ul>

        <div id="emptyState" class="empty-state hidden">
          <div class="empty-icon">🏖️</div>
          <p class="empty-title">할 일이 없습니다</p>
          <p class="empty-desc">새로운 목표를 추가해 하루를 알차게 채워보세요.</p>
        </div>
      </main>

      <!-- Footer Controls -->
      <footer class="app-footer">
        <div class="footer-left">
          <button id="toggleAllBtn" class="text-btn">모두 완료/해제</button>
        </div>
        <div class="footer-right">
          <button id="clearCompletedBtn" class="text-btn danger">완료 항목 삭제</button>
        </div>
      </footer>

      <!-- HD2Lab Principles -->
      <div class="principles">
        <span>STAY CURIOUS</span>
        <span>KEEP BUILDING</span>
        <span>LIVE BETTER</span>
      </div>

    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
